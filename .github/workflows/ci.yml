name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    # Runs every step in bash, including on Windows, so the commands are the same on each platform
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only PyTorch keeps the install small; the tests do not need a GPU
      # - macOS has no CUDA builds, so its default PyTorch wheels are already CPU-only
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" != "macOS" ]; then
            pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -e ".[dev]"

      # Linting does not depend on the platform, so it only runs once
      - name: Lint
        if: runner.os == 'Linux'
        run: ruff check .

      - name: Test
        run: python -m pytest

  interface:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: make install-web

      - name: Lint and type check
        run: make lint-web

      - name: Build
        run: make build-web

      # The server ships the committed build, so it must match the source
      - name: Check committed build is up to date
        run: make check-webbuild
